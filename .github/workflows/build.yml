name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  # runeLiteVersion is 'latest.release', so this build is also an early warning that a new
  # RuneLite release has broken us - nothing else would catch it until someone opened a PR.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle runs on 21; the plugin itself still targets 11 via options.release.
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        # --refresh-dependencies so 'latest.release' isn't served from a stale cache, which
        # would defeat the point of the scheduled run.
        run: ./gradlew build --refresh-dependencies --stacktrace

      - name: Report the RuneLite version this was built against
        if: always()
        run: ./gradlew -q dependencies --configuration compileClasspath | grep -m1 'net.runelite:client' || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7

  snapshot:
    name: Build against upcoming RuneLite
    runs-on: ubuntu-latest
    # Advisory: a break here is RuneLite's next release, not this PR, so it must not block a
    # merge. It's the early warning that the required build above will start failing.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build against latest.integration
        run: ./gradlew build -Puse.snapshot --refresh-dependencies --stacktrace

      - name: Report the snapshot version used
        if: always()
        run: ./gradlew -q dependencies --configuration compileClasspath -Puse.snapshot | grep -m1 'net.runelite:client' || true
